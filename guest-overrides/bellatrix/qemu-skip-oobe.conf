# A QEMU device has no Amazon account. Mark setup complete and remove stale
# OOBE state before the framework chooses its default application. Doing this
# after framework_ready races App Manager's OOBE load and leaves setup UI over
# Home.

description "skip Bellatrix account setup under QEMU"

start on started filesystems_setup
stop on stopping filesystems

task

script
    preferences=/var/local/java/prefs/com.lab126.booklet.home.preferences

    mkdir -p /var/local/system /var/local/java/prefs
    chown root:javausers /var/local/java /var/local/java/prefs
    chmod 0775 /var/local/java /var/local/java/prefs
    rm -f /var/local/decanter/kpp_oobe_crash.txt
    touch /var/local/system/not_first_boot

    if [ -f "$preferences" ]; then
        sed -i '/^OOBE_DELETED=/d' "$preferences"
    fi
    echo 'OOBE_DELETED=true' >> "$preferences"
    chown framework:javausers "$preferences"
    chmod 0664 "$preferences"
end script
