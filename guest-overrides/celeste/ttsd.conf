# ttsd is optional on Celeste and requires separately installed voice data.
# Avoid an Upstart respawn loop when that data is not present.

start on started audio
stop on stopping audio

export LANG LC_ALL

pre-start script
    source /etc/upstart/functions

    if [ ! -d /mnt/us/tts/data ]; then
        f_log I ttsd no_voice_data "TTS disabled; no voice data installed"
        stop
        exit 0
    fi
end script

respawn
exec ttsd
