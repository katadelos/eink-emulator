# Wake powerd when its LIPC service is ready and again at GUI transitions.

start on started powerd or started lab126_gui or framework_ready
stop on stopping lab126

task

script
    while ! lipc-set-prop com.lab126.powerd preventScreenSaver 1 \
            >/dev/null 2>&1; do
        lipc-set-prop com.lab126.powerd wakeUp 1 >/dev/null 2>&1 || true
        sleep 1
    done
    lipc-set-prop com.lab126.powerd wakeUp 1 || exit 1
    echo "Woke main GUI for QEMU" > /dev/console || true
end script
