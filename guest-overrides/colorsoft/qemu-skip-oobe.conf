# A QEMU device has no network backend or Amazon account. Once the framework
# launches the stock setup application, return to the already-loaded Home app.

description "skip Colorsoft account setup under QEMU"

start on framework_ready
stop on stopping framework

task

script
    while :; do
        active_app=$(lipc-get-prop com.lab126.appmgrd activeApp 2>/dev/null || true)
        if [ "$active_app" = "com.lab126.KPPMainApp" ]; then
            exit 0
        fi
        if [ "$active_app" = "com.lab126.oobe" ] &&
                [ "$(lipc-get-prop com.lab126.appmgrd peekAppHistory 2>/dev/null)" = \
                  "com.lab126.KPPMainApp" ]; then
            lipc-set-prop com.lab126.booklet.home deleteOOBE qemu \
                >/dev/null 2>&1 || true
            lipc-set-prop com.lab126.appmgrd backward 1 \
                >/dev/null 2>&1 || true
        fi
        sleep 1
    done
end script
