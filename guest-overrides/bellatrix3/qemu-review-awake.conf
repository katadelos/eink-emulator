# Match the existing two-hour visual-review window. Refresh only while active;
# an actual power-key/screensaver transition remains effective.
description "Bounded Scribe visual-review idle refresh"
start on started powerd
stop on stopping powerd
task

script
    read uptime idle < /proc/uptime
    end=$(( ${uptime%%.*} + 7200 ))
    while :; do
        read uptime idle < /proc/uptime
        [ "${uptime%%.*}" -lt "$end" ] || break
        state=$(timeout 3 lipc-get-prop -s com.lab126.powerd state 2>/dev/null) || state=
        if [ "$state" = active ]; then
            timeout 3 lipc-set-prop -i com.lab126.powerd touchScreenSaverTimeout 1 >/dev/null 2>&1 || true
        fi
        sleep 30
    done
end script
