# The development image replaces the stock console job, so there is exactly
# one owner of ttyS0. Upstart supervises the session and respawns after exit.
description "Scribe development serial shell"
start on started system
stop on stopping system
respawn
respawn limit 10 60

script
    echo CS8_DEVELOPMENT_CONSOLE_READY > /dev/console
    exec /usr/bin/setsid -f -w /sbin/getty -L -i -n -l /bin/sh 921600 /dev/ttyS0
end script
