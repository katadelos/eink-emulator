# Stock MTU3 + g_ether CDC ECM, connected to QEMU's user network backend.
# Bring networking up independently of Java/KPP startup.
# The image builder disables the competing MTP job, which unloads g_ether.

start on (started network and started filesystems_var_local)
stop on stopping system

task
emits qemu_usb_network_ready

script
    set -e

    # Configuration 1 is ECM; EEM has different Ethernet framing.
    modprobe g_ether use_eem=0 \
        host_addr=ee:49:00:00:00:00 \
        dev_addr=ee:19:00:00:00:00

    ip link set dev usb0 down
    ip link set dev usb0 address ee:19:00:00:00:00
    ip addr replace 192.168.15.244/24 dev usb0
    ip link set dev usb0 up
    ip route replace default via 192.168.15.201 dev usb0
    printf 'nameserver 192.168.15.3\n' > /var/run/resolv.conf

    iptables -C INPUT -i usb0 -j ACCEPT 2>/dev/null ||
        iptables -I INPUT 1 -i usb0 -j ACCEPT

    for attempt in $(seq 1 30); do
        if [ "$(cat /sys/class/net/usb0/carrier)" = 1 ]; then
            logger -t qemu-usb-network 'Configured QEMU USB Ethernet on usb0'
            initctl emit qemu_usb_network_ready
            exit 0
        fi
        sleep 1
    done
    logger -t qemu-usb-network 'USB Ethernet configuration timed out: no carrier'
    exit 1
end script
