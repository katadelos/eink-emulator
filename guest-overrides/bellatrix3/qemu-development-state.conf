# A starting-event job blocks display itself until this finite initialization
# finishes. Stock display starts only after mounted_varLocal, including keys.
description "Initialize Scribe developer locale and local Home preferences"
start on starting display
stop on stopping system
task

script
    set -e
    /usr/sbin/qemu-runtime-permissions persistent
    state=/var/local/system/qemu-development
    mkdir -p "$state" /var/local/log
    chmod 0700 "$state"

    # liblab126utils reads this supported local override before mapping the
    # /proc/usid serial code. DVT tattoos are absent from deviceTypes.conf.
    # Run before the old initialized marker so existing development userdata
    # gains this field too. The image builder supplies the selected board's
    # published product type; this is not an account or registered identity.
    device_file=/var/local/deviceType.txt
    existing=$(cat "$device_file" 2>/dev/null || true)
    valid=0
    case "$existing" in
        A?*)
            case "$existing" in
                *[!A-Z0-9]*) ;;
                *)
                    # The native reader preserves every byte, including LF.
                    if [ "$(wc -c < "$device_file")" -eq "${#existing}" ]; then
                        valid=1
                    fi
                    ;;
            esac
            ;;
    esac
    if [ "$valid" -eq 0 ]; then
        if [ -e "$device_file" ] && [ ! -e "$state/deviceType.txt.backup" ]; then
            cp -p "$device_file" "$state/deviceType.txt.backup"
        fi
        cp /etc/qemu-device-type "$state/deviceType.txt.new"
        chown root:root "$state/deviceType.txt.new"
        chmod 0644 "$state/deviceType.txt.new"
        mv "$state/deviceType.txt.new" "$device_file"
    fi
    if [ -e "$state/initialized" ]; then
        exit 0
    fi
    mkdir -p "$state" /var/local/java/prefs
    chown root:javausers /var/local/java /var/local/java/prefs
    chmod 2775 /var/local/java /var/local/java/prefs

    locale=/var/local/system/locale
    if [ -e "$locale" ]; then
        cp -p "$locale" "$state/locale.backup"
    else
        touch "$state/locale.was-absent"
    fi
    # London is the developer's requested default; later user choices persist.
    printf 'LANG=en_GB.UTF-8\nLC_ALL=en_GB.UTF-8\n' > "$state/locale.new"
    chown root:javausers "$state/locale.new"
    chmod 0664 "$state/locale.new"
    mv "$state/locale.new" "$locale"

    preferences=/var/local/java/prefs/com.lab126.booklet.home.preferences
    if [ -e "$preferences" ]; then
        cp -p "$preferences" "$state/home.preferences.backup"
        sed '/^OOBE_DELETED=/d' "$preferences" > "$state/home.preferences.new"
    else
        touch "$state/home.preferences.was-absent"
        : > "$state/home.preferences.new"
    fi
    printf 'OOBE_DELETED=true\n' >> "$state/home.preferences.new"
    chown framework:javausers "$state/home.preferences.new"
    chmod 0664 "$state/home.preferences.new"
    mv "$state/home.preferences.new" "$preferences"
    touch /var/local/system/not_first_boot
    rm -f /var/local/decanter/kpp_oobe_crash.txt
    # No account identity, credentials, or server registration is manufactured.
    touch "$state/initialized"
    logger -t qemu-development 'Initialized local Home preferences and en_GB locale'
end script
