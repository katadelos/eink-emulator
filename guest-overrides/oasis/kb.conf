# Keep Oasis's GUI keyboard process from taking a broken shutdown path.

start on started lab126_gui or started langpicker
stop on stopping lab126_gui

env LIBC_FATAL_STDERR_=1
env STDERR=/tmp/kb.err

normal exit 0
respawn limit 1 3600

script
    source /etc/upstart/env

    exec kb 2>> $STDERR
end script

pre-stop script
    pkill -KILL -x kb 2>/dev/null || true
end script

post-stop script
    source /etc/upstart/functions
    libc_scan
end script
