# Keep Oasis 2 in airplane mode during framework startup until its radio has a
# network backend. Oasis 1 retains its stock wireless services.

start on dbus_ready
stop on stopping lab126

task

script
    touch /mnt/us/WIFIOFF
    echo "Disabled unbacked Oasis 2 Wi-Fi for QEMU" > /dev/console || true
    attempts=0
    while [ "$attempts" -lt 10 ]; do
        if lipc-set-prop -i com.lab126.cmd wirelessEnable 0; then
            echo "Enabled Oasis airplane mode for QEMU" > /dev/console || true
            exit 0
        fi
        attempts=$((attempts + 1))
        sleep 1
    done
    exit 1
end script
