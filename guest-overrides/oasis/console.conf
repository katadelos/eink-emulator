# Developer serial console for the local emulator.
start on started system
stop on stopping system

respawn

script
    UART=ttymxc0
    BAUD=115200
    for option in $(cat /proc/cmdline); do
        case "$option" in
            console=*)
                value=${option#console=}
                UART=${value%%,*}
                BAUD=${value#*,}
                ;;
        esac
    done
    exec getty -L "$BAUD" "/dev/$UART"
end script
