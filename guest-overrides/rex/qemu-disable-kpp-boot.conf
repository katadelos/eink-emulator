# BootActionsApplication is an optional KPP boot-progress UI. It is enabled by
# a flag created on the first boot of a rebuilt rootfs, but it does
# not initialize reliably in the VM. The separate OOBE application also fails
# to register its LIPC source and leaves a fatal alert over the working main
# application. Skip both optional first-boot paths and proceed to normal Home.

start on started filesystems_setup
stop on stopping filesystems

task

script
    rm -f /var/local/decanter/ENABLE_KPP_BOOT \
        /var/local/decanter/ENABLE_KPP_OOBE
    echo "Using blanket boot UI for QEMU" > /dev/console || true
    echo "Skipped KPP OOBE for QEMU" > /dev/console || true
end script
