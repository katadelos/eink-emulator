# A newly initialized varlocal can contain a zero-byte locale file.  The stock
# langpicker checks only for existence and skips setup, while KPPMainAppV2
# later assumes both values are present and aborts in fetchDeviceLocale().

start on mounted_varLocal
stop on stopping filesystems

task

script
    LOCALE_FILE=/var/local/system/locale
    if [ ! -s "$LOCALE_FILE" ]; then
        mkdir -p /var/local/system
        printf 'LANG=en_US.UTF-8\nLC_ALL=en_US.UTF-8\n' > "$LOCALE_FILE"
    fi
end script
