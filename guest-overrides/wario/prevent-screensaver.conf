# Keep the emulated Kindle awake while no power-button input is available.
#
# powerd may be reported as started just before it publishes its LIPC
# properties.  Retry until preventScreenSaver is accepted.  A later powerd
# restart emits another "started powerd" event and applies the property again.

start on started powerd
stop on stopping powerd

task

script
    while ! lipc-set-prop com.lab126.powerd preventScreenSaver 1 \
            >/dev/null 2>&1; do
        sleep 1
    done
    echo "Disabled automatic screensaver for QEMU" > /dev/console || true
end script
