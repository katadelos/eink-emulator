# kb (keyboard)

start on started lab126_gui or started langpicker
stop on stopping lab126_gui

env LIBC_FATAL_STDERR_=1
env STDERR=/tmp/kb.err

normal exit 0
respawn limit 1 3600

# Muscat's kb exits through a broken GTK cleanup path when Upstart sends
# SIGTERM, turning an intentional lab126_gui stop into status 139.  The daemon
# persists its settings as they change, so skip that crashing exit path.
kill signal KILL

script
    source /etc/upstart/env

    exec kb 2>> $STDERR
end script

post-stop script
    source /etc/upstart/functions
    libc_scan
end script
