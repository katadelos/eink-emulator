# Wake powerd as soon as its LIPC service is usable, then repeat after the GUI
# and framework transitions.  Waiting only for those later events allows
# powerd's boot-idle timer to enter suspend first.

start on started powerd or started lab126_gui or framework_ready
stop on stopping lab126

task

script
    while ! lipc-set-prop com.lab126.powerd preventScreenSaver 1 \
            >/dev/null 2>&1; do
        # Whitney does not treat a zForce tap as a power wakeup.  Keep asking
        # powerd to wake while its properties are still coming online.
        lipc-set-prop com.lab126.powerd wakeUp 1 >/dev/null 2>&1 || true
        sleep 1
    done
    lipc-set-prop com.lab126.powerd wakeUp 1 || exit 1
    echo "Woke main GUI for QEMU" > /dev/console || true
end script
