# ttsd is optional on Whitney and requires a separately installed Nuance voice.
#
# The stock job treats missing /mnt/us/tts/data as a crash and retries forever,
# flooding Upstart/LIPC and consuming enough emulated CPU to disrupt the GUI.

start on started audio
stop on stopping audio

export LANG LC_ALL

pre-start script
    source /etc/upstart/functions

    if [ ! -d /mnt/us/tts/data ]; then
        f_log I ttsd no_voice_data "TTS disabled; no voice data installed"
        stop
        exit 0
    fi
end script

respawn
exec ttsd
