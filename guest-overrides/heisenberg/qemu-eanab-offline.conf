# The emulated BCM43430 currently enumerates over SDIO but has no network
# backend. Keep the stock guest in airplane mode during framework startup.

start on dbus_ready
stop on stopping lab126

task

script
    attempts=0
    while [ "$attempts" -lt 10 ]; do
        if lipc-set-prop -i com.lab126.cmd wirelessEnable 0; then
            echo "Enabled Eanab airplane mode for QEMU" > /dev/console || true
            exit 0
        fi
        attempts=$((attempts + 1))
        sleep 1
    done
    exit 1
end script
