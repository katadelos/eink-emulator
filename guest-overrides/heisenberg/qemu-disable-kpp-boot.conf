# Heisenberg's first-boot KPP applications depend on device services which are
# not part of the QEMU machine. Remove their flags after /var/local is ready.

start on started filesystems_setup
stop on stopping filesystems

task

script
    rm -f /var/local/decanter/ENABLE_KPP_BOOT \
        /var/local/decanter/ENABLE_KPP_OOBE
    touch /mnt/us/WIFIOFF
    echo "Using blanket boot UI for QEMU" > /dev/console || true
    echo "Skipped KPP OOBE for QEMU" > /dev/console || true
    echo "Disabled unbacked Eanab Wi-Fi for QEMU" > /dev/console || true
end script
